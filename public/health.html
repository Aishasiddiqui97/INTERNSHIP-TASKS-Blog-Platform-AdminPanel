<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Health Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .status {
      font-size: 2rem;
      font-weight: bold;
      margin: 1rem 0;
      color: #22C55E;
    }
    .details {
      background-color: #1E293B;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      text-align: left;
      max-width: 600px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Blog Platform Health Check</h1>
  <div class="status">✅ Healthy</div>
  <div class="details">
    <p><strong>Server:</strong> Running</p>
    <p><strong>Database:</strong> Connected</p>
    <p><strong>Cloudinary:</strong> Configured</p>
  </div>
</body>
</html>
